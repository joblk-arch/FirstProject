services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      AGENT_GATEWAY_URL: http://host.docker.internal:8765
      AGENT_GATEWAY_ALLOWED_PROJECTS: firstproject,infrastructure
      DASHBOARD_USERNAME: admin
      DASHBOARD_USERS_FILE: /data/users.json
      DASHBOARD_AUDIT_LOG_FILE: /data/audit.jsonl
      DASHBOARD_TEMPLATES_FILE: /data/templates.json
      M5_HOST_URL: http://10.10.10.1:8000
      LMSTUDIO_URL: http://10.10.10.1:1234
      LMSTUDIO_TOKEN_FILE: /run/secrets/lm_studio_token
      TELEGRAM_BOT_URL: http://telegram-bot:8080
      OPENWEBUI_URL: http://open-webui:8080
      ROUTER_URL: http://router:4000
      HEALTH_CHECK_TIMEOUT: "5"
      HEALTH_CHECK_CONCURRENCY: "8"
    secrets:
      - agent_gateway_key
      - dashboard_password
      - lm_studio_token
    ports:
      - "192.168.68.68:8088:8080"
    networks:
      - default
      - m1-agent-repo_chat
    volumes:
      - /Users/jkutner/.local/share/m1-agent/dashboard-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  m1-agent-repo_chat:
    external: true

secrets:
  agent_gateway_key:
    file: /Users/jkutner/.local/share/m1-agent/agent-gateway.token
  dashboard_password:
    file: /Users/jkutner/.local/share/m1-agent/dashboard.password
  lm_studio_token:
    file: /Users/jkutner/Library/Application Support/LocalAI/lmstudio.token
